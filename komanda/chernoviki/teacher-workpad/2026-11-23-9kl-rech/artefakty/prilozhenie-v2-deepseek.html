<style>
:root {
  --fon: #0a0e18;
  --fon-svet1: #1b1440;
  --fon-svet2: #0b2a3a;
  --panel: #121a2b;
  --panel2: #18223a;
  --liniya: #2a3757;
  --tekst: #eef4ff;
  --tekst-tusk: #a9b8d6;
  --akcent: #3ee6ff;
  --akcent2: #ff5ad9;
  --podskazka: #ffd84a;
  --verno: #47f5a5;
  --neverno: #ff6b7a;
  --akcent-fon: rgba(62,230,255,.12);
  --akcent2-fon: rgba(255,90,217,.12);
  --podskazka-fon: rgba(255,216,74,.12);
  --verno-fon: rgba(71,245,165,.12);
  --neverno-fon: rgba(255,107,122,.12);
  --ten: 0 6px 24px rgba(0,0,0,.35);
  --shrift: "Segoe UI", system-ui, Arial, sans-serif;
  --razmer: 20px;
  --razmer-vopros: 22px;
  --razmer-ekran: 26px;
  --razmer-shapka: 26px;
  --razmer-melkiy: 18px;
  --radius: 14px;
  --radius-malyj: 10px;
  --knopka-min: 52px;
  --tolshchina-linii: 2px;
  --otstup: 16px;
  --otstup-malyj: 8px;
  --otstup-bolshoj: 24px;
  --shirina-ekrana: 1100px;
  --shirina-menyu: 460px;
  --shirina-shaga: 90px;
  --vysota-ekrana: 100vh;
  --razmer-avatara: 56px;
  --sloy-menyu: 50;
  --nul: 0;
  --polno: 100%;
  --krug: 50%;
  --edinica: 1;
  --sdvig-pryzhka: 10px;
  --dlitelnost: .35s;
  --zhirnyj: 600;
}
* { box-sizing: border-box; }
html, body { margin: var(--nul); padding: var(--nul); }
body {
  display: flex;
  flex-direction: column;
  height: var(--vysota-ekrana);
  overflow: hidden;
  font-family: var(--shrift);
  font-size: var(--razmer);
  color: var(--tekst);
  background: var(--fon);
}
.shapka {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--otstup);
  padding: var(--otstup-malyj) var(--otstup-bolshoj);
  background: var(--panel);
  border-bottom: var(--tolshchina-linii) solid var(--liniya);
}
.shapka-nazvanie {
  margin: var(--nul);
  font-size: var(--razmer-shapka);
  font-weight: var(--zhirnyj);
  color: var(--akcent);
}
.tochki {
  display: flex;
  gap: var(--otstup-malyj);
  flex-wrap: wrap;
}
.tochka {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--knopka-min);
  min-height: var(--knopka-min);
  font-family: var(--shrift);
  font-size: var(--razmer-melkiy);
  color: var(--tekst-tusk);
  background: var(--panel2);
  border: var(--tolshchina-linii) solid var(--liniya);
  border-radius: var(--radius-malyj);
  cursor: default;
}
.tochka.tekushaya {
  color: var(--fon);
  background: var(--akcent);
  border-color: var(--akcent);
}
.ekran {
  flex: 1 1 auto;
  overflow-y: auto;
  width: var(--polno);
  max-width: var(--shirina-ekrana);
  margin: var(--nul) auto;
  padding: var(--otstup-bolshoj);
}
.ekran-nazvanie {
  margin: var(--nul) var(--nul) var(--otstup);
  font-size: var(--razmer-ekran);
  color: var(--akcent2);
}
.ekran-tekst {
  margin: var(--nul) var(--nul) var(--otstup);
  color: var(--tekst-tusk);
}
.roli {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--otstup-malyj);
  margin-bottom: var(--otstup);
}
.roli-podpis { color: var(--tekst-tusk); }
.rol {
  padding: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  background: var(--akcent2-fon);
  color: var(--akcent2);
}
.znanie {
  padding: var(--otstup);
  margin-bottom: var(--otstup);
  border-left: var(--tolshchina-linii) solid var(--akcent2);
  border-radius: var(--radius-malyj);
  background: var(--panel2);
}
.krasnyj-flag {
  padding: var(--otstup);
  margin-bottom: var(--otstup);
  border-left: var(--tolshchina-linii) solid var(--neverno);
  border-radius: var(--radius-malyj);
  background: var(--neverno-fon);
  color: var(--neverno);
}
.drakon {
  display: block;
  width: var(--polno);
  max-width: 420px;
  margin: var(--nul) auto var(--otstup);
}
.zadanie {
  padding: var(--otstup);
  margin-bottom: var(--otstup);
  background: var(--panel);
  border: var(--tolshchina-linii) solid var(--liniya);
  border-radius: var(--radius);
  box-shadow: var(--ten);
}
.hod {
  display: inline-block;
  padding: var(--otstup-malyj);
  margin-bottom: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  background: var(--akcent2-fon);
  color: var(--akcent2);
  font-size: var(--razmer-melkiy);
}
.vopros {
  margin: var(--nul) var(--nul) var(--otstup-malyj);
  font-size: var(--razmer-vopros);
}
.telo {
  display: flex;
  flex-direction: column;
  gap: var(--otstup-malyj);
}
.variant, .variant-poryadok {
  display: block;
  width: var(--polno);
  min-height: var(--knopka-min);
  padding: var(--otstup-malyj) var(--otstup);
  text-align: left;
  font-family: var(--shrift);
  font-size: var(--razmer);
  color: var(--tekst);
  background: var(--panel2);
  border: var(--tolshchina-linii) solid var(--liniya);
  border-radius: var(--radius-malyj);
  cursor: pointer;
}
.variant:hover, .variant-poryadok:hover { border-color: var(--akcent); }
.variant.vybran { border-color: var(--akcent); background: var(--akcent-fon); }
.vybor-shaga, .para-vybor, .pole-chislo, .pole-tekst {
  min-height: var(--knopka-min);
  padding: var(--otstup-malyj);
  font-family: var(--shrift);
  font-size: var(--razmer);
  color: var(--tekst);
  background: var(--panel2);
  border: var(--tolshchina-linii) solid var(--liniya);
  border-radius: var(--radius-malyj);
}
.pole-tekst { width: var(--polno); }
.stroka-poryadka, .stroka-pary, .stroka-frazy {
  display: flex;
  align-items: center;
  gap: var(--otstup);
}
.nomer-shaga { min-width: var(--shirina-shaga); color: var(--tekst-tusk); }
.levo { color: var(--akcent); }
.fraza-tekst {
  flex: 1 1 auto;
  padding: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  background: var(--panel2);
}
.knopka-ozvuchit {
  min-height: var(--knopka-min);
  padding: var(--otstup-malyj) var(--otstup);
  font-family: var(--shrift);
  font-size: var(--razmer-melkiy);
  color: var(--akcent);
  background: var(--akcent-fon);
  border: var(--tolshchina-linii) solid var(--akcent);
  border-radius: var(--radius-malyj);
  cursor: pointer;
}
.upravlenie {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--otstup-malyj);
  margin-top: var(--otstup);
}
.knopka-proverit, .knopka-podskazka {
  min-height: var(--knopka-min);
  padding: var(--otstup-malyj) var(--otstup);
  font-family: var(--shrift);
  font-size: var(--razmer);
  border-radius: var(--radius-malyj);
  cursor: pointer;
  border: var(--tolshchina-linii) solid var(--akcent);
  background: var(--akcent-fon);
  color: var(--akcent);
}
.knopka-podskazka {
  border-color: var(--podskazka);
  background: var(--podskazka-fon);
  color: var(--podskazka);
}
.podskazka {
  margin: var(--otstup-malyj) var(--nul) var(--nul);
  padding: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  color: var(--podskazka);
  background: var(--podskazka-fon);
}
.itog-verno {
  margin: var(--otstup-malyj) var(--nul) var(--nul);
  padding: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  color: var(--verno);
  background: var(--verno-fon);
}
.itog-neverno {
  margin: var(--otstup-malyj) var(--nul) var(--nul);
  padding: var(--otstup-malyj);
  border-radius: var(--radius-malyj);
  color: var(--neverno);
  background: var(--neverno-fon);
}
.obyasnenie-tekst {
  margin: var(--otstup-malyj) var(--nul) var(--nul);
  padding-left: var(--otstup);
  border-left: var(--tolshchina-linii) solid var(--verno);
  color: var(--tekst-tusk);
}
.pomoshnik {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--otstup);
  padding: var(--otstup);
  background: var(--panel2);
  border-top: var(--tolshchina-linii) solid var(--liniya);
}
.pomoshnik-avatar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--razmer-avatara);
  height: var(--razmer-avatara);
  border-radius: var(--krug);
  border: var(--tolshchina-linii) solid var(--akcent);
  background: var(--akcent-fon);
  color: var(--akcent);
  font-size: var(--razmer-melkiy);
}
.pomoshnik-tekst { margin: var(--nul); color: var(--tekst); }
@keyframes poyavlenie {
  from { opacity: var(--nul); transform: translateY(var(--sdvig-pryzhka)); }
  to { opacity: var(--edinica); transform: translateY(var(--nul)); }
}
.prygaet { animation: poyavlenie var(--dlitelnost) ease-out; }
.menyu {
  display: none;
  position: fixed;
  top: var(--otstup);
  right: var(--otstup);
  width: var(--shirina-menyu);
  max-height: var(--vysota-ekrana);
  overflow-y: auto;
  padding: var(--otstup);
  background: var(--panel);
  border: var(--tolshchina-linii) solid var(--akcent2);
  border-radius: var(--radius);
  z-index: var(--sloy-menyu);
}
.menyu.otkryto { display: block; }
.menyu-zagolovok {
  margin: var(--nul) var(--nul) var(--otstup-malyj);
  font-size: var(--razmer-vopros);
  color: var(--akcent2);
}
.menyu-stroka, .menyu-knopka {
  display: block;
  width: var(--polno);
  min-height: var(--knopka-min);
  margin-bottom: var(--otstup-malyj);
  padding: var(--otstup-malyj);
  text-align: left;
  font-family: var(--shrift);
  font-size: var(--razmer-melkiy);
  color: var(--tekst);
  background: var(--panel2);
  border: var(--tolshchina-linii) solid var(--liniya);
  border-radius: var(--radius-malyj);
  cursor: pointer;
}
.samoproverka-zagolovok {
  margin: var(--otstup-malyj) var(--nul);
  color: var(--verno);
  font-size: var(--razmer-melkiy);
}
.narushenie {
  margin: var(--nul) var(--nul) var(--otstup-malyj);
  color: var(--neverno);
  font-size: var(--razmer-melkiy);
}
</style>
</head>

// ===== СЛОВАРЬ (действия) =====
var PROGRESS = { nomer: 1, otvety: {}, podskazki: {} };

// najti: найти элемент по id | вход: id | выход: элемент | изменяет: —
function najti(id){
  return document.getElementById(id);
}

// sozdat: создать элемент | вход: тег, класс, текст | выход: элемент | изменяет: —
function sozdat(teg, klass, tekst){
  var el = document.createElement(teg);
  if (klass) { el.className = klass; }
  if (tekst) { el.textContent = tekst; }
  return el;
}

// ochistit: убрать всех детей | вход: элемент | выход: — | изменяет: элемент
function ochistit(el){
  while (el.firstChild) { el.removeChild(el.firstChild); }
}

// sohranit: сохранить прогресс | вход: — | выход: — | изменяет: localStorage
function sohranit(){
  try {
    localStorage.setItem(VSELENNAYA.urok.id, JSON.stringify(PROGRESS));
  } catch (e) { }
}

// zagruzit: загрузить прогресс | вход: — | выход: — | изменяет: PROGRESS
function zagruzit(){
  PROGRESS = { nomer: 1, otvety: {}, podskazki: {} };
  try {
    var s = localStorage.getItem(VSELENNAYA.urok.id);
    if (s) { PROGRESS = JSON.parse(s); }
  } catch (e) { }
  if (!PROGRESS.nomer) { PROGRESS.nomer = 1; }
  if (!PROGRESS.otvety) { PROGRESS.otvety = {}; }
  if (!PROGRESS.podskazki) { PROGRESS.podskazki = {}; }
}

// cvet: прочитать цвет из :root | вход: имя переменной | выход: строка | изменяет: —
function cvet(imya){
  return getComputedStyle(document.documentElement).getPropertyValue(imya).trim();
}

// atom: найти атом вселенной | вход: id | выход: атом или null | изменяет: —
function atom(id){
  var rez = null;
  var i = 0;
  while (i < VSELENNAYA.atomy.length && rez === null) {
    if (VSELENNAYA.atomy[i].id === id) { rez = VSELENNAYA.atomy[i]; }
    i = i + 1;
  }
  return rez;
}

// estVSpiske: есть ли значение в списке | вход: список, значение | выход: true или false | изменяет: —
function estVSpiske(spisok, znachenie){
  var rez = false;
  if (znachenie) {
    if (Array.isArray(znachenie)) {
      rez = true;
      var i;
      for (i = 0; i < znachenie.length; i++) {
        if (!estVSpiske(spisok, znachenie[i])) { rez = false; }
      }
    } else {
      rez = spisok.indexOf(znachenie) >= 0;
    }
  }
  return rez;
}

// zadaniyaVse: все задания урока | вход: — | выход: список атомов | изменяет: —
function zadaniyaVse(){
  return VSELENNAYA.atomy.filter(function(a){ return a.tip === "zadanie"; });
}

// zadaniyaEkrana: задания одного экрана | вход: id экрана | выход: список атомов | изменяет: —
function zadaniyaEkrana(id){
  return VSELENNAYA.atomy.filter(function(a){ return a.tip === "zadanie" && a.ekran === id; });
}

// strokiRavny: равны ли два списка строк | вход: два списка | выход: true или false | изменяет: —
function strokiRavny(a, b){
  var rez = true;
  if (!a || !b || a.length !== b.length) {
    rez = false;
  } else {
    var i;
    for (i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) { rez = false; }
    }
  }
  return rez;
}

// paraEst: есть ли пара в эталоне | вход: пара, эталон | выход: true или false | изменяет: —
function paraEst(para, etalon){
  var rez = false;
  var j;
  for (j = 0; j < etalon.length; j++) {
    if (para[0] === etalon[j][0] && para[1] === etalon[j][1]) { rez = true; }
  }
  return rez;
}

// paryRavny: совпадают ли наборы пар | вход: два списка пар | выход: true или false | изменяет: —
function paryRavny(a, b){
  var rez = true;
  if (!a || !b || a.length !== b.length) {
    rez = false;
  } else {
    var i;
    for (i = 0; i < a.length; i++) {
      if (!paraEst(a[i], b)) { rez = false; }
    }
  }
  return rez;
}

// zadanieVerno: верно ли отвечено задание | вход: id задания | выход: true или false | изменяет: —
function zadanieVerno(id){
  var z = atom(id);
  var otvet = PROGRESS.otvety[id];
  var rez = false;
  if (z && otvet !== undefined && otvet !== null) {
    rez = proveritOtvet(z, otvet);
  }
  return rez;
}

// risovatRoli: показать роли в паре | вход: список ролей | выход: элемент | изменяет: —
function risovatRoli(roli){
  var blok = sozdat("div", "roli");
  blok.appendChild(sozdat("span", "roli-podpis", "Роли в паре:"));
  roli.forEach(function(r){ blok.appendChild(sozdat("span", "rol", r)); });
  return blok;
}

// risovatStanciyu: один блок ДРАКОН-схемы | вход: svg, ns, y, текст, жёлтый | выход: — | изменяет: svg
function risovatStanciyu(svg, ns, y, tekst, zheltyj){
  var r = document.createElementNS(ns, "rect");
  r.setAttribute("x", "60");
  r.setAttribute("y", String(y));
  r.setAttribute("width", "300");
  r.setAttribute("height", "70");
  r.setAttribute("rx", "12");
  r.setAttribute("fill", zheltyj ? cvet("--podskazka") : cvet("--panel2"));
  r.setAttribute("stroke", cvet("--akcent"));
  r.setAttribute("stroke-width", "2");
  svg.appendChild(r);
  var t = document.createElementNS(ns, "text");
  t.setAttribute("x", "210");
  t.setAttribute("y", String(y + 44));
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("fill", zheltyj ? cvet("--fon") : cvet("--tekst"));
  t.setAttribute("font-size", "18");
  t.textContent = tekst;
  svg.appendChild(t);
}

// risovatStrelku: стрелка между блоками | вход: svg, ns, y | выход: — | изменяет: svg
function risovatStrelku(svg, ns, y){
  var l = document.createElementNS(ns, "line");
  l.setAttribute("x1", "210");
  l.setAttribute("y1", String(y + 70));
  l.setAttribute("x2", "210");
  l.setAttribute("y2", String(y + 120));
  l.setAttribute("stroke", cvet("--akcent"));
  l.setAttribute("stroke-width", "3");
  svg.appendChild(l);
}

// risovatDrakon: ДРАКОН-схема конвейера | вход: — | выход: svg | изменяет: —
function risovatDrakon(){
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 420 620");
  svg.setAttribute("class", "drakon");
  var stancii = ["Звук", "Фонемы", "Буквы/подслова (гипотезы)", "Слова", "Предложение"];
  var i;
  for (i = 0; i < stancii.length; i++) {
    risovatStanciyu(svg, ns, 20 + i * 120, stancii[i], i === 0);
    if (i < stancii.length - 1) { risovatStrelku(svg, ns, 20 + i * 120); }
  }
  return svg;
}

// pokazatDrakon: показать схему после верного 9027 | вход: — | выход: — | изменяет: экран
function pokazatDrakon(){
  var m = najti("ekran");
  if (!najti("drakon-konveer")) {
    var svg = risovatDrakon();
    svg.id = "drakon-konveer";
    m.appendChild(svg);
  }
}

// ozvuchit: озвучить текст | вход: текст | выход: — | изменяет: речь браузера
function ozvuchit(tekst){
  if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(tekst);
    u.lang = "ru-RU";
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

// proveritOtvet: сверить ответ с эталоном | вход: задание, ответ | выход: true или false | изменяет: —
function proveritOtvet(zadanie, otvet){
  var rez = true;
  if (zadanie.vid === "vybor") { rez = otvet === zadanie.otvet; }
  else if (zadanie.vid === "chislo") { rez = Math.abs(Number(otvet) - zadanie.otvet) <= zadanie.dopusk; }
  else if (zadanie.vid === "poryadok") { rez = strokiRavny(otvet, zadanie.otvet); }
  else if (zadanie.vid === "para") { rez = paryRavny(otvet, zadanie.otvet); }
  return rez;
}

// sobratPoryadok: собрать порядок из полей | вход: карточка | выход: список или null | изменяет: —
function sobratPoryadok(karta){

  var vybory = karta.querySelectorAll(".vybor-shaga");
  var polno = true;
  var i;
  for (i = 0; i < vybory.length; i++) {
    if (!vybory[i].value) { polno = false; }

  if (polno) {
    for (i = 0; i < vybory.length; i++) { rez.push(vybory[i].value); }

    rez = null;

// sobratPary: собрать пары из полей | вход: карточка | выход: список пар или null | изменяет: —

// sobratOtvet: прочитать ответ с карточки | вход: задание | выход: ответ или null | изменяет: —
function sobratOtvet(zadanie){
  var karta = najti("karta-" + zadanie.id);
  var rez = null;
  if (zadanie.vid === "poryadok") { rez = sobratPoryadok(karta); }
  else if (zadanie.vid === "para") { rez = sobratPary(karta); }

}

// proveritIZapomnit: проверить и запомнить ответ | вход: задание, ответ | выход: — | изменяет: PROGRESS
function proveritIZapomnit(zadanie, otvet){
  PROGRESS.otvety[zadanie.id] = otvet;
  if (!PROGRESS.podskazki[zadanie.id]) { PROGRESS.podskazki[zadanie.id] = 0; }
  var ok = proveritOtvet(zadanie, otvet);

  sohranit();
}

// datPodskazku: следующая ступень подсказки | вход: задание | выход: — | изменяет: PROGRESS

  var nomer = PROGRESS.podskazki[zadanie.id] || 0;

// narushenieP1: проверка P1 для задания | вход: задание | выход: текст нарушения или "" | изменяет: —
function narushenieP1(z){
  var rez = "";
  if (z.vid === "para") {
    rez = proveritP1Para(z);
  } else if (z.vid !== "tekst" && z.vid !== "chislo") {
    if (!estVSpiske(z.varianty, z.otvet)) { rez = "P1: " + z.id + " — ответ не входит в варианты"; }

}

// proveritP1Para: проверка P1 для пар | вход: задание | выход: текст нарушения или "" | изменяет: —
function proveritP1Para(z){
  var rez = "";
  var i, p;
  for (i = 0; i < z.otvet.length; i++) {
    p = z.otvet[i];
    if (!estVSpiske(z.varianty, p[0])) { rez = "P1: " + z.id + " — левая часть пары не из вариантов"; }
    else if (!estVSpiske(z.pravo, p[1])) { rez = "P1: " + z.id + " — правая часть пары не из списка"; }

}

  return rez;
}

// proveritP4: правило P4 | вход: — | выход: текст нарушения или "" | изменяет: —
function proveritP4(){
  var rez = "";
  var i, a;
  for (i = 0; i < VSELENNAYA.atomy.length; i++) {
    a = VSELENNAYA.atomy[i];
    if (a.tip === "fakt" && a.mir === "0001" && a.istinnost !== 1) {
      rez = "P4: " + a.id + " — факт мира 0001 с истинностью " + a.istinnost;
    }
  }
  return rez;
}

// estSlabyjFakt: есть ли у задания условный факт | вход: задание | выход: true или false | изменяет: —
function estSlabyjFakt(z){
  var rez = false;
  var j, f;
  for (j = 0; j < (z.fakty || []).length; j++) {
    f = atom(z.fakty[j]);
    if (f && f.istinnost !== 1) { rez = true; }
  }
  return rez;
}

// proveritP5: правило P5 | вход: — | выход: текст нарушения или "" | изменяет: —
function proveritP5(){
  var rez = "";
  var spisok = zadaniyaVse();
  var i, z;
  for (i = 0; i < spisok.length; i++) {
    z = spisok[i];
    if (z.mir !== "0002" && estSlabyjFakt(z)) { rez = "P5: " + z.id + " — условный факт вне мира 0002"; }
  }
  return rez;
}

// proveritL1: правило L1 | вход: — | выход: текст нарушения или "" | изменяет: —
function proveritL1(){
  var rez = "";
  var i, a;
  for (i = 0; i < VSELENNAYA.atomy.length; i++) {
    a = VSELENNAYA.atomy[i];
    if (a.tip === "ekran" && a.praktikum && (!a.roli || a.roli.length !== 2)) {
      rez = "L1: " + a.id + " — у практикума не две роли";
    }
  }
  return rez;
}

// proveritL2: правило L2 | вход: — | выход: текст нарушения или "" | изменяет: —
function proveritL2(){
  var rez = "";
  var i, a, r = 0, s = 0;
  for (i = 0; i < VSELENNAYA.atomy.length; i++) {
    a = VSELENNAYA.atomy[i];
    if (a.proces === "raspoznavanie") { r = r + 1; }
    if (a.proces === "sintez") { s = s + 1; }
  }
  if (r === 0 || s === 0) { rez = "L2: нет заданий на распознавание или на синтез"; }
  return rez;
}

// proveritPravilo: проверить одно правило | вход: правило | выход: текст нарушения или "" | изменяет: —
function proveritPravilo(p){
  var rez = "";
  if (p.id === "P1") { rez = proveritP1(); }
  else if (p.id === "P2") { rez = proveritP2(); }
  else if (p.id === "P3") { rez = proveritP3(); }
  else if (p.id === "P4") { rez = proveritP4(); }
  else if (p.id === "P5") { rez = proveritP5(); }
  else if (p.id === "L1") { rez = proveritL1(); }
  else if (p.id === "L2") { rez = proveritL2(); }
  return rez;
}

// itogSamoproverki: блок итога самопроверки | вход: — | выход: блок | изменяет: —
function itogSamoproverki(){
  var narusheniya = samoproverka();
  var blok = sozdat("div", "samoproverka");
  blok.appendChild(sozdat("h4", "samoproverka-zagolovok", "Самопроверка: нарушений " + narusheniya.length));
  narusheniya.forEach(function(n){ blok.appendChild(sozdat("p", "narushenie", n)); });
  return blok;
}

// samoproverka: пройти все правила | вход: — | выход: список нарушений | изменяет: —
function samoproverka(){
  var spisok = [];
  VSELENNAYA.pravila.forEach(function(p){
    var b = proveritPravilo(p);
    if (b) { spisok.push(b); }
  });
  return spisok;
}

// otklikKlavishi: реакция на Ctrl+Alt+M | вход: событие | выход: — | изменяет: меню
function otklikKlavishi(e){
  if (e.ctrlKey && e.altKey && e.code === "KeyM") {
    e.preventDefault();
    menyuUchitelya();
  }
}

// slushatKlavishu: слушать горячую клавишу | вход: — | выход: — | изменяет: документ
function slushatKlavishu(){
  document.addEventListener("keydown", otklikKlavishi);
}

// perejti: сменить экран | вход: номер | выход: — | изменяет: PROGRESS, экран
function perejti(nomer){
  if (nomer && nomer >= 1 && nomer <= VSELENNAYA.ekrany.length) {
    PROGRESS.nomer = nomer;
    risovatEkran(atom(VSELENNAYA.ekrany[nomer - 1]));
    obnovitTochki();
    sohranit();
  }
}

// menyuUchitelya: скрытое меню учителя | вход: — | выход: — | изменяет: меню
function menyuUchitelya(){
  var m = najti("menyu");
  if (m.classList.contains("otkryto")) {
    m.classList.remove("otkryto");
    ochistit(m);
  } else {
    ochistit(m);
    m.classList.add("otkryto");
    m.appendChild(sozdat("h3", "menyu-zagolovok", "Меню учителя — " + VSELENNAYA.urok.nazvanie));
    VSELENNAYA.ekrany.forEach(function(id, i){ m.appendChild(strokaMenyu(id, i)); });
    m.appendChild(knopkaSbrosa());
    m.appendChild(itogSamoproverki());
  }
}

// urokNachat: запустить урок | вход: — | выход: — | изменяет: весь экран
function urokNachat(){
  zagruzit();
  slushatKlavishu();
  najti("shapka-nazvanie").textContent = VSELENNAYA.urok.nazvanie;
  perejti(PROGRESS.nomer);
  var n = samoproverka();
  if (n.length > 0) { skazatPomoshnik("Самопроверка: нарушений " + n.length + ". Меню учителя: Ctrl+Alt+M."); }
}

// ===== ЗАПУСК =====
urokNachat();
</script>
